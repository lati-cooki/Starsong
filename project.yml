name: Starsong
options:
  bundleIdPrefix: com.starsong
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    # Set here rather than in Xcode: the .xcodeproj is generated and git-ignored,
    # so a team picked in Signing & Capabilities is lost on the next regenerate.
    # Project-wide so the test bundles get it too — without it, building for
    # testing against a device fails to sign.
    DEVELOPMENT_TEAM: FNUEYV4H8Q

targets:
  Starsong:
    type: application
    platform: iOS
    sources:
      - path: Sources
    configFiles:
      Debug: Config/Starsong.xcconfig
      Release: Config/Starsong.xcconfig
    settings:
      base:
        PRODUCT_NAME: Starsong
        PRODUCT_BUNDLE_IDENTIFIER: com.starsong.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      testTargets:
        - StarsongTests
        - StarsongUITests
      gatherCoverageData: true

  StarsongUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/StarsongUITests
    dependencies:
      - target: Starsong
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.starsong.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Starsong

  StarsongTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/StarsongTests
    dependencies:
      - target: Starsong
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.starsong.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Starsong.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Starsong"
        BUNDLE_LOADER: "$(TEST_HOST)"
